name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 依据：07-立项准备 §1.5 / 03-技术栈 §5
# 卡点：typecheck + lint + format:check + test:coverage + e2e 全绿方可合并
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：action-setup v4 会从 package.json 的 packageManager
        # 字段（pnpm@9.12.0）读取。同时指定 version 会报
        # "Multiple versions of pnpm specified" 并让整个 job 在第一步就失败
        # ——这正是本仓库 CI 自 2026-08 起从未真正跑过测试的原因。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # G19：pi-server 独立类型程序（src/pi-server + tests/pi-server，412 条错误已清零）。
      # 这块代码被主 tsconfig 的 exclude 长期挡在门外，只靠主 typecheck 覆盖不到。
      - name: Typecheck pi-server
        run: pnpm typecheck:pi-server

      # G18：源码/测试目录内不得出现被 .gitignore 忽略的文件
      # （2026-11-09：.gitignore 的 `logs/` 吞掉 apps/desktop/src/main/logs/，
      #  本机 typecheck 绿、CI 干净 clone 直接 TS2307，此处前置拦截）
      - name: Source tracking check
        run: pnpm check:src

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Doc drift check
        run: pnpm check:docs

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build for E2E
        run: pnpm --filter @urchin/desktop build

      - name: E2E tests
        run: pnpm e2e

      # E2E 失败时上传 Playwright 产物（error-context.md DOM 快照 / 截图 / trace），
      # 供归因 CI 环境差异：2026-11-05 四个 omnibox 用例超时因无产物只能盲猜，
      # 本步骤保证下次失败可直接取证。
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 7
