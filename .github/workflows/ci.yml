name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 依据：07-立项准备 §1.5 / 03-技术栈 §5
# 卡点：typecheck + lint + test --coverage + e2e 全绿方可合并
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: E2E tests
        run: pnpm e2e
        env:
          # Playwright Electron 测试需要 display
          DISPLAY: ':99'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 7
