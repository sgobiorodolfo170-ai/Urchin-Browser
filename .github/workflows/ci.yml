name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 依据：07-立项准备 §1.5 / 03-技术栈 §5
# 卡点：typecheck + lint + format:check + test:coverage + e2e 全绿方可合并
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：action-setup v4 会从 package.json 的 packageManager
        # 字段（pnpm@9.12.0）读取。同时指定 version 会报
        # "Multiple versions of pnpm specified" 并让整个 job 在第一步就失败
        # ——这正是本仓库 CI 自 2026-08 起从未真正跑过测试的原因。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Doc drift check
        run: pnpm check:docs

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build for E2E
        run: pnpm --filter @urchin/desktop build

      - name: E2E tests
        run: pnpm e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 7
