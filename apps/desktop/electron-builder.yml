# electron-builder 配置
# 依据：03-技术栈 §1 T4 / 07-立项准备 §1
# 首版仅 Windows x64

appId: com.urchin.browser
productName: Urchin Browser
copyright: Copyright © 2026 Urchin Browser Contributors

directories:
  output: release-v24
  buildResources: build

# 入口：electron-builder 会用 main 字段定位主进程
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - '!**/*.map'
  # 排除工作区包内被 symlink 带入的测试产物（gitignore 已忽略，避免 asar 打包报错）
  - '!**/coverage/**'
  - '!**/*.tsbuildinfo'

# 额外资源：图标文件复制到 resources 目录（运行时窗口图标用）
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  # GenOffice 嵌入产物（scripts/genoffice-build.mjs 前置生成，见阶段 1）：
  # 主进程经绝对路径 require embed；renderer 由 genoffice-app:// 协议按文件
  # 路径读取——两者都必须在 asar 之外，故放 extraResources。
  # 注意：产物缺失时 electron-builder 会直接报错——这是有意的门禁
  # （package:win 已内置 genoffice:build 前置步骤）。
  - from: ../../vendor/genoffice/apps/urchin-embed/out/main/index.js
    to: genoffice/embed/index.js
  - from: ../../vendor/genoffice/apps/markdown/out/renderer
    to: genoffice/apps/markdown/renderer
  - from: ../../vendor/genoffice/apps/markdown/out/preload/index.js
    to: genoffice/apps/markdown/preload/index.js
  - from: ../../vendor/genoffice/apps/pdf/out/renderer
    to: genoffice/apps/pdf/renderer
  - from: ../../vendor/genoffice/apps/pdf/out/preload/index.js
    to: genoffice/apps/pdf/preload/index.js
  - from: ../../vendor/genoffice/apps/html/out/renderer
    to: genoffice/apps/html/renderer
  - from: ../../vendor/genoffice/apps/html/out/preload/index.js
    to: genoffice/apps/html/preload/index.js
  - from: ../../vendor/genoffice/apps/docs/out/renderer
    to: genoffice/apps/docs/renderer
  - from: ../../vendor/genoffice/apps/docs/out/preload/index.js
    to: genoffice/apps/docs/preload/index.js
  # PDF 文本编辑运行时 wasm：pdf-main 的 wasm-path 在打包态按
  # process.resourcesPath/wasm/<file> 解析（开发态走 vendor node_modules）
  - from: ../../vendor/genoffice/node_modules/@embedpdf/pdfium/dist/pdfium.wasm
    to: wasm/pdfium.wasm
  - from: ../../vendor/genoffice/apps/pdf/node_modules/harfbuzzjs/hb-subset.wasm
    to: wasm/hb-subset.wasm
  # 许可合规（Apache-2.0 NOTICE 传播 + 第三方声明）：随包分发 GenOffice 的
  # LICENSE / NOTICE / THIRD-PARTY-NOTICES（后者由 vendor `npm run notices`
  # 生成后复制到 vendor 根，见 VENDOR.md）
  - from: ../../vendor/genoffice/LICENSE
    to: genoffice/LICENSE
  - from: ../../vendor/genoffice/NOTICE
    to: genoffice/NOTICE
  - from: ../../vendor/genoffice/THIRD-PARTY-NOTICES.txt
    to: genoffice/THIRD-PARTY-NOTICES.txt

# Windows 配置
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Urchin Browser
  # 卸载即全卸（dev.42 用户原则）：移除 AppData\Roaming\<app>——cookies 与 pi 模块
  # 全部数据（pi/agent 会话、pi/npm-global 沙箱）都在其中；浏览器主数据在软件根
  # data/（DD1），随安装目录删除。
  deleteAppDataOnUninstall: true

# 原生模块重新构建（2026-09 Electron 43 升级调整）：
# - better-sqlite3 v13 起为 N-API + 包内预编译产物（prebuilds/win32-x64.node），
#   跨 Node/Electron 版本通用，无需 rebuild（Electron 43 实测可直接加载）。
# - node-pty 等原生模块由 pi-web 的「系统 Node」子进程使用，必须保持 Node ABI，
#   绝不能被 electron-builder 重编为 Electron ABI。
# 因此关闭自动 rebuild，原生产物按 pnpm 安装后的原始状态打包。
npmRebuild: false

# node_modules 整体移出 asar：pi-web-ui 由外部「系统 Node」子进程直启（pi-web 启动器），
# 系统 Node 无法读取 asar 内文件——pi-web-ui 及其运行时依赖（ws、node-pty 等）必须是
# asar 外的实体文件；better-sqlite3 等原生模块同样受益（.node 本就无法从 asar 加载）。
asarUnpack:
  - '**/node_modules/**'

# v0.1 暂无代码签名（CON-07：v0.1 不引入签名基础设施依赖）
# v0.4+ 引入代码签名

# v0.1 不启用自动更新（避免 electron-builder update-info 创建失败）
publish: null
