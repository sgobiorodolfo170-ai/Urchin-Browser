name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 依据：07-立项准备 §1.5 / 03-技术栈 §5
# 卡点：typecheck + lint + format:check + test:coverage + e2e 全绿方可合并
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：action-setup v4 会从 package.json 的 packageManager
        # 字段（pnpm@9.12.0）读取。同时指定 version 会报
        # "Multiple versions of pnpm specified" 并让整个 job 在第一步就失败
        # ——这正是本仓库 CI 自 2026-08 起从未真正跑过测试的原因。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 注：pi-server（src/pi-server + tests/pi-server）自 2026-11-09 已并入主 tsconfig，
      # 由上面的 Typecheck 步骤覆盖；此前的独立 `Typecheck pi-server` 步骤（G19）已退休。

      # G18：源码/测试目录内不得出现被 .gitignore 忽略的文件
      # （2026-11-09：.gitignore 的 `logs/` 吞掉 apps/desktop/src/main/logs/，
      #  本机 typecheck 绿、CI 干净 clone 直接 TS2307，此处前置拦截）
      - name: Source tracking check
        run: pnpm check:src

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Doc drift check
        run: pnpm check:docs

      # G20：E2E manifest ↔ spec 文件双向一致（新增 spec 未登记 / 删除 spec 留孤儿）
      - name: E2E manifest check
        run: pnpm check:e2e-manifest

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build for E2E
        run: pnpm --filter @urchin/desktop build

      # A1（2026-11-10）：GenOffice 嵌入产物补齐
      #
      # 背景：genoffice-*.spec.ts 依赖 vendor/genoffice/apps/urchin-embed/out/main/index.js，
      # 而 out/ 被 vendor/genoffice/.gitignore 忽略——CI 干净 clone 没有产物，此前
      # 9 个用例稳定 skip（26 passed / 12 skipped）。
      #
      # 缓存决策（2026-11-10 实测）：本机热构建 347.7s（5.8 min，vendor node_modules
      # 与 sheets Rust target 均已存在）；CI 冷构建还要额外做 vendor npm ci + Rust
      # sidecar 冷编译，实测口径上必然超过 8 分钟，故缓存产物与 vendor 依赖（约 1.8 GB）。
      # 缓存命中时跳过构建，但必须再跑 --check-only —— 否则缓存损坏会让 9 个用例
      # 静默回到 skip，CI 仍绿而覆盖已丢。键只含 package-lock 与构建脚本：升级
      # vendor/genoffice 上游时若只改源码未改 lock，需手动把 key 里的 v1 递增
      # （见 docs/打包核查清单.md）。
      - name: Cache GenOffice build artifacts
        id: genoffice-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/genoffice/node_modules
            vendor/genoffice/apps/*/out
            vendor/genoffice/apps/sheets/native/xlsx-engine/target
            vendor/genoffice/THIRD-PARTY-NOTICES.txt
          key: genoffice-${{ runner.os }}-v1-${{ hashFiles('vendor/genoffice/package-lock.json', 'scripts/genoffice-build.mjs') }}

      - name: Build GenOffice embed artifacts
        if: steps.genoffice-cache.outputs.cache-hit != 'true'
        run: pnpm genoffice:build

      - name: Verify GenOffice artifacts
        run: node scripts/genoffice-build.mjs --check-only

      - name: E2E tests
        run: pnpm e2e

      # E2E 失败时上传 Playwright 产物（error-context.md DOM 快照 / 截图 / trace），
      # 供归因 CI 环境差异：2026-11-05 四个 omnibox 用例超时因无产物只能盲猜，
      # 本步骤保证下次失败可直接取证。
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 7
