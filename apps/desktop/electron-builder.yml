# electron-builder 配置
# 依据：03-技术栈 §1 T4 / 07-立项准备 §1
# 首版仅 Windows x64

appId: com.urchin.browser
productName: 顽童浏览器
copyright: Copyright © 2026 Urchin Browser Contributors

directories:
  output: release-v24
  buildResources: build

# afterPack 钩子（2026-11-07 dev.158 打包实测修复）：
# traversal 收集器只沿 dependencies / optionalDependencies 建图，pnpm 解析出的
# peerDependency（如 @deepseek-ai/cordis-plugin-group）会被系统性漏打，导致安装版
# DeepSeek Harness 启动即退出（ERR_MODULE_NOT_FOUND）。钩子在 app 目录组装完成、
# NSIS 生成之前，把生产依赖闭包里缺失的 peer-only 包平铺补进
# app.asar.unpacked/node_modules（dsh 由外部纯 Node 进程直读该目录，不经 asar 层）。
# 因 electron-builder 禁止 hook 路径越出应用目录，钩子放在 apps/desktop/scripts/。
afterPack: scripts/after-pack-dsh-peers.cjs

# 入口：electron-builder 会用 main 字段定位主进程
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  # 阶段 2 自研前端（pi-web-host 的 wwwDir；打包态从 asar 内读取，utilityProcess 可读 asar）
  - dist/pi-web/**/*
  # 内置 Provider 子进程代码（2026-11-12 dev.193 修复）：build:provider 用 esbuild
  # 把 src/main/orchestrator/providers/openai-compatible.ts 编译为
  # dist/providers/openai-compatible.js，主进程首启从 asar 内该路径复制部署到
  # userData（src/main/index.ts 首启部署逻辑）。此前 files 从未包含
  # dist/providers/**，安装版首启报 built-in provider not found in dist、AI
  # 不可用（核查清单 §10 #13 登记的既有缺陷）。
  - dist/providers/**/*
  - package.json
  - '!**/*.map'
  # 排除工作区包内被 symlink 带入的测试产物（gitignore 已忽略，避免 asar 打包报错）
  - '!**/coverage/**'
  - '!**/*.tsbuildinfo'
  # 安装耗时整改（2026-11-11 dev.191）：node_modules 里的非运行时文件不进包。
  # dev.190 实测 app.asar.unpacked/node_modules 有 53,463 个实体文件（占全树
  # 97.9%），其中 26,388 个是类型声明（.d.ts/.d.cts/.d.mts）、npm 包附带的
  # TS 源码、.md 文档与 .map（合计 171 MB），运行时从不加载。NSIS 会把整棵树
  # 先解压到 %TEMP%\ns*.tmp\7z-out 再 CopyFiles 到安装目录，文件数直接决定
  # 安装耗时（F14 实测拷贝 54k 文件约 10 分钟）。
  # ⚠ 必须用 files 排除（组装期不收），不要在 afterPack 里剪除实体：app.asar
  # 内保留着同一批文件的索引条目（dev.190 实测 57,964 条 node_modules 条目），
  # 只删 app.asar.unpacked 的文件会留下「目录可见、打开报 ENOENT」的幽灵条目。
  # 排除项会同时进入 electron-builder 的 nodeModuleFilePatterns（见
  # builder-debug.yml），asar 索引与实体文件同步减少；afterPack 的 MAX_PATH
  # 剪除器保持原样，继续兜底超长路径（§8 F12）。
  # 合规：LICENSE / NOTICE / THIRD-PARTY-NOTICES.txt 一律保留（Apache-2.0
  # 传播要求），故不排除 License 类文件。
  # 运行时核查：1,347 个 package.json 中仅 66 个（@deepseek-ai/* 内嵌的
  # zod 4.4.3 副本）有非 types 条件指向 .ts，条件名均为 @zod/source（打包器
  # 专用，纯 Node 走 import/require 的 .js/.cjs），剪 src/*.ts 不影响 dsh
  # 启动；每次打包仍须按 §7.3 跑 dsh 冒烟复核。
  - '!**/node_modules/**/*.ts'
  - '!**/node_modules/**/*.cts'
  - '!**/node_modules/**/*.mts'
  - '!**/node_modules/**/*.md'
  # 安装耗时整改第二批（2026-11-12 dev.192 B1）：renderer-only 包实体副本不进包。
  # vite 已把 react 系全部打进 asar bundle（dev.191 dist 产物 grep 无 require/import
  # 字面量，主进程 external 仅 better-sqlite3）；dsh 依赖闭包（@deepseek-ai/*/
  # package.json 逐包实测）不含下列任何包——运行时没有任何进程会从 node_modules
  # 读它们，实体副本纯属 traversal 收集器沿生产依赖建图时顺带落盘（dev.191 实测
  # 9 项 2,344 文件，lucide-react 图标库 2,180 个 ESM 文件为大头）。zod /
  # postal-mime 保留不动：主进程源码有 import，且 zod 疑似被 dsh 闭包向上解析。
  - '!**/node_modules/react/**'
  - '!**/node_modules/react-dom/**'
  - '!**/node_modules/lucide-react/**'
  - '!**/node_modules/@radix-ui/**'
  - '!**/node_modules/clsx/**'
  - '!**/node_modules/tailwind-merge/**'
  - '!**/node_modules/marked/**'
  - '!**/node_modules/turndown/**'
  - '!**/node_modules/defuddle/**'
  # 平台裁剪（2026-11-12 dev.193 体积事故整改 · 本项目只发布 Windows x64）：
  # 依赖树里 5 组包按平台拆分、写在 optionalDependencies 里，pnpm 若不加限制会
  # 把 darwin / linux / win32-arm64 / ia32 / wasm 变体全部装进 .pnpm，traversal
  # 收集器再原样打进 app.asar.unpacked。实测（dev.193 重打包）这些非目标平台包
  # 占解压态约 1 GB：libreoffice-kit 5 平台 837 MB（真正需要的 win32-x64 仅
  # 192 MB）、sharp 25 个变体、ripgrep 13 个、sherpa-onnx 6 个、node-addon-
  # require-builtin 9 个。表现是安装包 295 MB → 646 MB（+119%），功能零收益。
  # 治本开关在根 package.json 的 pnpm.supportedArchitectures（见 pnpm-workspace
  # .yaml 说明），本段是第二道防线：即使 pnpm 装进了非目标平台包，也不进产物。
  # ⚠ 与 B1 同理，必须走 files（组装期不收）。若只在 afterPack 删实体，app.asar
  # 里仍留着索引条目，形成幽灵条目。新增平台拆分包时须同步 afterPack 的
  # FOREIGN_PLATFORM_RULES，两处口径必须一致。
  - '!**/node_modules/@deepseek-ai/libreoffice-kit-darwin-*/**'
  - '!**/node_modules/@deepseek-ai/libreoffice-kit-win32-arm64/**'
  - '!**/node_modules/@deepseek-ai/libreoffice-kit-wasm/**'
  - '!**/node_modules/@img/sharp-darwin-*/**'
  - '!**/node_modules/@img/sharp-linux*/**'
  - '!**/node_modules/@img/sharp-freebsd-*/**'
  - '!**/node_modules/@img/sharp-wasm32/**'
  - '!**/node_modules/@img/sharp-webcontainers-*/**'
  - '!**/node_modules/@img/sharp-win32-arm64/**'
  - '!**/node_modules/@img/sharp-win32-ia32/**'
  - '!**/node_modules/@img/sharp-libvips-darwin-*/**'
  - '!**/node_modules/@img/sharp-libvips-linux*/**'
  - '!**/node_modules/@vscode/ripgrep-darwin-*/**'
  - '!**/node_modules/@vscode/ripgrep-linux*/**'
  - '!**/node_modules/@vscode/ripgrep-win32-arm64/**'
  - '!**/node_modules/@vscode/ripgrep-win32-ia32/**'
  - '!**/node_modules/sherpa-onnx-darwin-*/**'
  - '!**/node_modules/sherpa-onnx-linux-*/**'
  - '!**/node_modules/sherpa-onnx-win-ia32/**'
  - '!**/node_modules/node-addon-require-builtin-darwin-*/**'
  - '!**/node_modules/node-addon-require-builtin-linux-*/**'
  - '!**/node_modules/node-addon-require-builtin-win32-arm64-*/**'
  - '!**/node_modules/node-addon-require-builtin-win32-ia32-*/**'
  - '!**/node_modules/@koromix/koffi-darwin-*/**'
  - '!**/node_modules/@koromix/koffi-linux-*/**'
  - '!**/node_modules/@koromix/koffi-freebsd-*/**'
  - '!**/node_modules/@koromix/koffi-openbsd-*/**'
  - '!**/node_modules/@koromix/koffi-win32-arm64/**'
  - '!**/node_modules/@koromix/koffi-win32-ia32/**'
  # node-addon-system 的 optionalDependencies 只声明 darwin/linux（无 win32），
  # Windows 走主包内置实现，平台子包可直接剔除（打包后 dsh 冒烟兜验）。
  - '!**/node_modules/@deepseek-ai/node-addon-system-darwin-*/**'
  - '!**/node_modules/@deepseek-ai/node-addon-system-linux-*/**'
  # 精确排除（2026-11-13 dev.193 收尾）：包名**不带**平台后缀，只能靠
  # package.json 的 os 字段识别的包。上方前缀规则与 supportedArchitectures 都
  # 按目录名/平台后缀匹配，拦不住这类包——dev.193 上一轮筛残留时用的匹配词是
  # darwin / linux，而本包用的是 macos，被漏掉后 3.6 MB 进了产物。
  # @deepseek-ai/dsh-experimental-cua-macos 的 manifest 为 os: ["darwin"]，是
  # dsh-cua-bundle 的 optionalDependency，只在 macOS 上有实现。
  # 新增同类包时须同步 afterPack 的 EXPLICIT_FOREIGN_PACKAGES（该脚本另有
  # manifest os/cpu 自动判定兜底，本清单是显式可审计的那一层）。
  - '!**/node_modules/@deepseek-ai/dsh-experimental-cua-macos/**'

# 额外资源：图标文件复制到 resources 目录（运行时窗口图标用）
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  # X4：便携 Node（scripts/fetch-node.mjs 前置生成，本机已存在时幂等跳过）——
  # 打包态 dsh 启动器用 resources/node/node.exe 直启 npm 包
  # @deepseek-ai/dsh/lib/bin.js（dsh 的 node-addon-require-builtin 校验拒绝
  # Electron V8 指纹，无法复用 ELECTRON_RUN_AS_NODE；pi-web 仍用 Electron
  # 内置 Node，不需要此文件）。注意：产物缺失时 electron-builder 直接报错——
  # 这是有意的门禁（package:win 已内置 fetch-node 前置步骤）。
  - from: build/node/node.exe
    to: node/node.exe
  # GenOffice 嵌入产物（scripts/genoffice-build.mjs 前置生成，见阶段 1）：
  # 主进程经绝对路径 require embed；renderer 由 genoffice-app:// 协议按文件
  # 路径读取——两者都必须在 asar 之外，故放 extraResources。
  # 注意：产物缺失时 electron-builder 会直接报错——这是有意的门禁
  # （package:win 已内置 genoffice:build 前置步骤）。
  - from: ../../vendor/genoffice/apps/urchin-embed/out/main/index.js
    to: genoffice/embed/index.js
  # 启动优化：宿主 ready 前注册特权 scheme 用的轻量常量 JSON
  # （genoffice-extract-scheme-privileges 从嵌入包抽取，见 vendor 侧
  # scheme-privileges.ts；避免启动早期加载整个 embed bundle）
  - from: ../../vendor/genoffice/apps/urchin-embed/out/main/scheme-privileges.json
    to: genoffice/embed/scheme-privileges.json
  # 模块类型标记（2026-11-07 dev.158 修复）：嵌入包是 CJS，但打包后所在目录向上
  # 若存在 "type": "module" 的 package.json（例如从仓库内 release-*/win-unpacked
  # 启动会命中 apps/desktop/package.json），Node 会把 embed/index.js 当 ESM 执行 →
  # ReferenceError: exports is not defined in ES module scope → GenOffice 整体降级。
  # 该文件由 scripts/genoffice-build.mjs 3.55 步骤生成（内容 {"type":"commonjs"}）。
  - from: ../../vendor/genoffice/apps/urchin-embed/out/main/package.json
    to: genoffice/embed/package.json
  - from: ../../vendor/genoffice/apps/markdown/out/renderer
    to: genoffice/apps/markdown/renderer
  - from: ../../vendor/genoffice/apps/markdown/out/preload/index.js
    to: genoffice/apps/markdown/preload/index.js
  - from: ../../vendor/genoffice/apps/pdf/out/renderer
    to: genoffice/apps/pdf/renderer
  - from: ../../vendor/genoffice/apps/pdf/out/preload/index.js
    to: genoffice/apps/pdf/preload/index.js
  - from: ../../vendor/genoffice/apps/html/out/renderer
    to: genoffice/apps/html/renderer
  - from: ../../vendor/genoffice/apps/html/out/preload/index.js
    to: genoffice/apps/html/preload/index.js
  - from: ../../vendor/genoffice/apps/docs/out/renderer
    to: genoffice/apps/docs/renderer
  - from: ../../vendor/genoffice/apps/docs/out/preload/index.js
    to: genoffice/apps/docs/preload/index.js
  # 阶段 5：Slides（pptx）编辑器 renderer + preload
  - from: ../../vendor/genoffice/apps/slides/out/renderer
    to: genoffice/apps/slides/renderer
  - from: ../../vendor/genoffice/apps/slides/out/preload/index.js
    to: genoffice/apps/slides/preload/index.js
  # 阶段 5：Sheets（xlsx）编辑器 renderer + preload
  - from: ../../vendor/genoffice/apps/sheets/out/renderer
    to: genoffice/apps/sheets/renderer
  - from: ../../vendor/genoffice/apps/sheets/out/preload/index.js
    to: genoffice/apps/sheets/preload/index.js
  # 上游 shell Home 前端（阶段 4.6）：宿主自有 preload 承载 window.aiOffice
  - from: ../../vendor/genoffice/apps/shell/out/renderer
    to: genoffice/apps/shell/renderer
  # PDF 文本编辑运行时 wasm：pdf-main 的 wasm-path 在打包态按
  # process.resourcesPath/wasm/<file> 解析（开发态走 vendor node_modules）
  - from: ../../vendor/genoffice/node_modules/@embedpdf/pdfium/dist/pdfium.wasm
    to: wasm/pdfium.wasm
  - from: ../../vendor/genoffice/apps/pdf/node_modules/harfbuzzjs/hb-subset.wasm
    to: wasm/hb-subset.wasm
  # 阶段 5：Sheets Rust xlsx-sidecar 二进制（paths.ts 打包态按
  # process.resourcesPath/native/<file> 解析；开发态走 vendor target/release）
  - from: ../../vendor/genoffice/apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe
    to: native/xlsx-sidecar.exe
  # 许可合规（Apache-2.0 NOTICE 传播 + 第三方声明）：随包分发 GenOffice 的
  # LICENSE / NOTICE / THIRD-PARTY-NOTICES。后者由 genoffice-build.mjs 调用
  # `npm run notices`（tools/gen-third-party-notices.mjs）生成到
  # apps/shell/build/ 后复制到 vendor 根；electron-builder 从此路径打包到
  # resources/genoffice/THIRD-PARTY-NOTICES.txt。
  # 2026-11-03 审计修复：此前 genoffice-build.mjs 漏跑 notices 步骤，导致
  # 打包报 "file source doesn't exist" warning 且安装包缺少第三方声明文件。
  # 修复后 genoffice-build.mjs 3.6 步骤自动生成+复制，并加入产物校验清单。
  - from: ../../vendor/genoffice/LICENSE
    to: genoffice/LICENSE
  - from: ../../vendor/genoffice/NOTICE
    to: genoffice/NOTICE
  - from: ../../vendor/genoffice/THIRD-PARTY-NOTICES.txt
    to: genoffice/THIRD-PARTY-NOTICES.txt

# Windows 配置
win:
  # 显式指定 exe/安装包图标（Windows 任务管理器的每个进程图标都取自 exe 内嵌
  # 资源；缺省虽会回退 buildResources/icon.ico，但显式声明避免打包资源目录变动
  # 时静默退回 Electron 原生图标）。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 文件名不含空格：GitHub 上传会把资产名中的空格归一化为「.」，而更新清单
  # dev.yml 的下载 URL 由 electron-updater 按「-」拼接（GitHubProvider.resolveFiles），
  # 含空格时实际资产名（点）与请求名（连字符）不一致 → 下载 404（dev.114 实测）。
  artifactName: Urchin-Browser-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 顽童浏览器
  # 卸载即全卸（dev.42 用户原则）：移除 AppData\Roaming\<app>——cookies 与 pi 模块
  # 全部数据（pi/agent 会话、pi/npm-global 沙箱）都在其中；浏览器主数据在软件根
  # data/（DD1），随安装目录删除。
  deleteAppDataOnUninstall: true

# 原生模块重新构建（2026-09 Electron 43 升级调整）：
# - better-sqlite3 v13 起为 N-API + 包内预编译产物（prebuilds/win32-x64.node），
#   跨 Node/Electron 版本通用，无需 rebuild（Electron 43 实测可直接加载）。
# - node-pty 等原生模块由 pi-web 的「系统 Node」子进程使用，必须保持 Node ABI，
#   绝不能被 electron-builder 重编为 Electron ABI。
# 因此关闭自动 rebuild，原生产物按 pnpm 安装后的原始状态打包。
npmRebuild: false

# node_modules 整体移出 asar：pi-web-ui 由外部「系统 Node」子进程直启（pi-web 启动器），
# 系统 Node 无法读取 asar 内文件——pi-web-ui 及其运行时依赖（ws、node-pty 等）必须是
# asar 外的实体文件；better-sqlite3 等原生模块同样受益（.node 本就无法从 asar 加载）。
asarUnpack:
  - '**/node_modules/**'

# 安装耗时整改（2026-11-12 dev.192 B2）：Electron 运行时 locales 只留实际语言。
# 默认随包 55 个 .pak（47MB）；应用界面本身按 locale 显示中英文名（brand.ts 只区分
# zh* 与其余），Chromium 对缺失语言回退 en-US，故裁剪为 zh-CN / zh-TW / en-US
# 三项运行时安全（约 -52 文件 / -43MB）。
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

# v0.1 暂无代码签名（CON-07：v0.1 不引入签名基础设施依赖）
# v0.4+ 引入代码签名

# 自动更新（dev.114 提前落地，用户指令「设置页更新按钮接入发布版更新路径」）：
# 更新源 = GitHub Releases dev 预发布通道（仓库 PUBLIC，应用内无需 token）。
# 该配置有两处作用：① 打包时在产物内生成 resources/app-update.yml（运行时
# electron-updater 读取 provider 信息）；② 在本地产出 dev.yml 更新清单
# （含版本号 + 安装包 sha512），随安装包上传到对应 release——本机打包
# --publish never 不上传，发布由 gh release upload 显式完成。
# 版本号约定：0.1.0-dev.NNN（package-win.mjs 从 CHANGELOG 派生盖章）。
# 更新通道由下方 publish.channel 显式指定为 dev → electron-builder 生成 dev.yml；
# electron-updater 端 channel="dev" + allowPrerelease=true 与之匹配。
# ⚠ 不要删除 channel 字段：app-builder-lib 26 对 GitHub provider 不按版本
#   预发布段自动派生通道（实测会回落到 latest.yml），删除后运行时取 dev.yml 将 404。
# ⚠ 发布纪律：每个 release 必须同时上传 exe + blockmap + dev.yml，
# 缺 dev.yml 时检查更新直接报错（CHANNEL_FILE_NOT_FOUND，不会回退跳版本）。
# ⚠ 不要置回 null：electron-builder 26 仅在发布配置存在时写更新清单
# （app-builder-lib PublishManager），置 null 则 dev.yml / app-update.yml
# 双双消失、自动更新整体失效（历史注释「避免 update-info 创建失败」的
# 场景已由本地 --publish never 规避）。
# CON-07（v0.1 无代码签名）不阻塞本链路：NSIS 更新路径校验 dev.yml 内的
# sha512 完整性，不做 Authenticode 检查；签名校验留 v0.4+。
publish:
  - provider: github
    owner: sgobiorodolfo170-ai
    repo: Urchin-Browser
    releaseType: prerelease
    channel: dev
